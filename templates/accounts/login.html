
{% extends "base.html" %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4 py-12 rounded-2xl">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-8 sm:p-10">

        <!-- Header -->
        <div class="text-center mb-8">

            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-5 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-8 w-8 text-white"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                </svg>
            </div>

            <h1 class="text-3xl font-bold text-slate-800">
                Welcome Back
            </h1>

            <p class="text-slate-500 mt-2 text-sm">
                Login to your account to continue
            </p>

        </div>

        <!-- Login Form -->
        <form method="post" class="space-y-5">

            {% csrf_token %}

            <!-- Username -->
            <div>
                <label class="block font-semibold mb-2 text-slate-700 text-sm">
                    Username
                </label>

                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg"
                             class="h-5 w-5"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke="currentColor">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  stroke-width="2"
                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </span>

                    <input
                        name="username"
                        type="text"
                        class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:bg-white transition duration-200"
                        placeholder="Enter your username"
                        required
                        autofocus
                    />
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block font-semibold mb-2 text-slate-700 text-sm">
                    Password
                </label>

                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg"
                             class="h-5 w-5"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke="currentColor">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  stroke-width="2"
                                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </span>

                    <input
                        name="password"
                        type="password"
                        class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:bg-white transition duration-200"
                        placeholder="Enter your password"
                        required
                    />
                </div>
            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl font-semibold text-base shadow-md hover:shadow-lg transition duration-200 active:scale-[0.98]">
                Login
            </button>

        </form>

        <!-- Register Link -->
        <div class="mt-7 pt-6 border-t border-slate-100 text-center">

            <p class="text-sm text-slate-500">
                Don't have an account?

                <a href="{% url 'register' %}"
                   class="text-indigo-600 hover:text-indigo-800 font-semibold ml-1 transition-colors">
                    Register here
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
